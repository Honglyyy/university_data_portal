{% extends 'myapp/base.html' %}

{% block title %}Confirm Logout{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4 text-center">
        <div class="card shadow-sm border-0">
            <div class="card-body p-5">
                <div class="mb-4 text-warning">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-box-arrow-right" viewBox="0 0 16 16">
                      <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2z"/>
                      <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z"/>
                    </svg>
                </div>
                <h3 class="font-weight-bold mb-3">Sign out?</h3>
                <p class="text-muted mb-4">Are you sure you want to sign out of your account?</p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
                    <form action="/logout/" method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger px-4 py-2">Log out</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
